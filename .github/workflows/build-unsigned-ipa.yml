name: Build unsigned IPA with Xcode 27

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned IPA
    runs-on: xcode-27
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify Xcode and SDK
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -showsdks
          xcodebuild -version | grep -E '^Xcode 27([.[:space:]]|$)'
          xcrun --sdk iphoneos --show-sdk-version | grep -E '^27([.]|$)'

      - name: Verify Daily Mix behavior
        run: |
          set -euo pipefail
          xcrun swiftc Metal/DailyMixEngine.swift Tests/DailyMixEngineChecks.swift -o "$RUNNER_TEMP/daily-mix-checks"
          "$RUNNER_TEMP/daily-mix-checks"
          xcrun swiftc Metal/DailyMixEngine.swift Metal/MixSessionEngine.swift Tests/MixSessionChecks.swift -o "$RUNNER_TEMP/mix-session-checks"
          "$RUNNER_TEMP/mix-session-checks"
          xcrun swiftc Metal/ListeningHistory.swift Metal/LibraryCollectionEngine.swift Metal/DailyMixEngine.swift Metal/MixSessionEngine.swift Tests/LibraryCollectionChecks.swift -o "$RUNNER_TEMP/library-collection-checks"
          "$RUNNER_TEMP/library-collection-checks"
          xcrun swiftc Metal/ListeningHistory.swift Tests/ListeningHistoryChecks.swift -o "$RUNNER_TEMP/listening-history-checks"
          "$RUNNER_TEMP/listening-history-checks"

      - name: Verify Metal shader pipelines
        run: |
          set -euo pipefail
          xcrun swiftc -parse-as-library -framework Metal Tests/MetalShaderChecks.swift -o "$RUNNER_TEMP/metal-shader-checks"
          "$RUNNER_TEMP/metal-shader-checks"

      - name: Render app icon appearances
        run: bash Tests/ExportIconPreviews.sh Metal/MetalStarAppIcon.icon "$RUNNER_TEMP/MetalIconPreviews"

      - name: Upload app icon previews
        uses: actions/upload-artifact@v6
        with:
          name: Metal-icon-previews-${{ github.sha }}
          path: ${{ runner.temp }}/MetalIconPreviews/*.png
          if-no-files-found: error

      - name: Build unsigned app
        run: |
          set -euo pipefail
          xcodebuild \
            -project Metal.xcodeproj \
            -scheme Metal \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}.${{ github.run_attempt }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            clean build

      - name: Verify packaged icon identity and build version
        env:
          EXPECTED_BUILD_VERSION: ${{ github.run_number }}.${{ github.run_attempt }}
        run: |
          python3 - <<'PY'
          import os, pathlib, plistlib
          app = pathlib.Path(os.environ["RUNNER_TEMP"]) / "DerivedData/Build/Products/Release-iphoneos/Metal.app"
          with (app / "Info.plist").open("rb") as stream:
              info = plistlib.load(stream)
          assert info["CFBundleVersion"] == os.environ["EXPECTED_BUILD_VERSION"], info["CFBundleVersion"]
          for key in ("CFBundleIcons", "CFBundleIcons~ipad"):
              primary = info[key]["CFBundlePrimaryIcon"]
              assert primary["CFBundleIconName"] == "MetalStarAppIcon", primary
              assert all(name.startswith("MetalStarAppIcon") for name in primary["CFBundleIconFiles"]), primary
          icons = list(app.glob("MetalStarAppIcon*.png"))
          assert icons, "missing compatibility icons for system surfaces"
          assert not list(app.glob("AppIcon*.png")), "stale icon family in app bundle"
          with (app / "PlugIns/MetalWidgetsExtension.appex/Info.plist").open("rb") as stream:
              assert plistlib.load(stream)["CFBundleVersion"] == info["CFBundleVersion"]
          print("Verified icon family: MetalStarAppIcon; build:", info["CFBundleVersion"])
          print("Compatibility icons:", ", ".join(icon.name for icon in icons))
          PY

      - name: Embed entitlements for sideload resigners
        run: |
          set -euo pipefail

          app_path="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/Metal.app"
          widget_path="$app_path/PlugIns/MetalWidgetsExtension.appex"

          # This is an ad-hoc metadata signature: no Apple identity and no
          # provisioning profile. SideStore needs it to discover App Groups
          # before replacing it with the user's real development signature.
          /usr/bin/codesign --force --sign - \
            --entitlements "$GITHUB_WORKSPACE/MetalWidgets/MetalWidgets.entitlements" \
            "$widget_path"
          /usr/bin/codesign --force --sign - \
            --entitlements "$GITHUB_WORKSPACE/Metal/Metal.entitlements" \
            "$app_path"

          /usr/bin/codesign --verify --deep --strict "$app_path"
          /usr/bin/codesign -d --entitlements :- "$app_path" 2>&1 \
            | grep -F 'group.ru.femboypig.Metal'
          /usr/bin/codesign -d --entitlements :- "$widget_path" 2>&1 \
            | grep -F 'group.ru.femboypig.Metal'

      - name: Package app as unsigned IPA
        run: |
          set -euo pipefail

          app_path="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/Metal.app"
          widget_path="$app_path/PlugIns/MetalWidgetsExtension.appex"
          package_root="$RUNNER_TEMP/UnsignedIPA"

          test -d "$app_path"
          test -f "$app_path/Metal"
          test ! -f "$app_path/embedded.mobileprovision"
          test -d "$widget_path"
          test -f "$widget_path/MetalWidgetsExtension"
          test ! -f "$widget_path/embedded.mobileprovision"

          mkdir -p "$package_root/Payload" "$GITHUB_WORKSPACE/dist"
          ditto "$app_path" "$package_root/Payload/Metal.app"
          (
            cd "$package_root"
            ditto -c -k --sequesterRsrc --keepParent Payload \
              "$GITHUB_WORKSPACE/dist/Metal-unsigned.ipa"
          )

          unzip -t "$GITHUB_WORKSPACE/dist/Metal-unsigned.ipa"
          unzip -l "$GITHUB_WORKSPACE/dist/Metal-unsigned.ipa"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v6
        with:
          name: Metal-unsigned-${{ github.sha }}
          path: dist/Metal-unsigned.ipa
          if-no-files-found: error
          compression-level: 0
